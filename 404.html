<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Error 404</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#111;text-align:center}
    .error404{transform:translateY(-1vh)}
    .error404 h1{margin:0 0 8px;font-size:32px;line-height:1.15;font-weight:700}
    .error404 p{margin:0;font-size:14px;line-height:1.4;font-weight:400;color:#444}
  </style>
</head>
<body>
  <main class="error404" id="fallback404" role="main">
    <h1>Error 404</h1>
    <p>Page not found.</p>
  </main>
<script>
(function () {
  'use strict';

  function getRouteInfo() {
    var path = decodeURIComponent(location.pathname || '');
    var marker = '/files-portal/';
    var at = path.indexOf(marker);
    if (at < 0) return null;

    var tail = path.slice(at + marker.length).replace(/^\/+|\/+$/g, '');
    if (!tail || tail.indexOf('/') !== -1) return null;

    var base = path.slice(0, at).replace(/\/+$/, '');
    return { token: tail, root: (base || '') + '/' };
  }

  function urlFromRoot(root, relative) {
    return root.replace(/\/$/, '') + '/' + String(relative || '').replace(/^\/+/, '');
  }

  var info = getRouteInfo();
  if (!info) return;

  fetch(urlFromRoot(info.root, 'data/routes.json'), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('routes');
      return r.json();
    })
    .then(function (routes) {
      if (!routes || !routes[info.token]) throw new Error('route');
      return fetch(urlFromRoot(info.root, 'files-portal/viewer.html'), { cache: 'no-store' });
    })
    .then(function (r) {
      if (!r.ok) throw new Error('viewer');
      return r.text();
    })
    .then(function (viewerHtml) {
      document.open();
      document.write(viewerHtml);
      document.close();
    })
    .catch(function () {
      // Keep the exact Error 404 page already visible.
    });
})();
</script>
</body>
</html>
